<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css"/>
    <title>Todoit!</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <!-- header section  -->
        <div class="logo-header">
          <img src="../assets/logo.png" alt="logo of the page - a neon owl" />
        </div>
        <nav class="nav-header">
          <a href="../index.html">Home</a>
          <a href="Tasks.html">Tasks</a>
          <a href="Stats.html">Stats</a>
          <a href="Settings.html">Settings</a>
          <a href="about.html">About</a>
        </nav>
      </header>
    </div>

    <main>
      <!-- main-section  -->
      <div class="Statistic-title">
        <h1>Statistics</h1>
        <p>
          Welcome to the Statistics page! Here you can view your task completion
          stats and productivity trends.
        </p>
      </div>

      <!-- main content -->
      <div class="stats-container">
        <div class="stats-column todo">
          <div class="column-header">
            <i class="fas fa-list-ul"></i>
            <h3>TO DO</h3>
          </div>
          <div class="column-body" id="todo-list">
            <div class="stat-task-card">
              <p class="stat-task-title">Fix Table Layout</p>
            </div>
          </div>
        </div>

        <div class="stats-column progress">
          <div class="column-header">
            <i class="fas fa-spinner"></i>
            <h3>IN PROGRESS</h3>
          </div>
          <div class="column-body" id="progress-list"></div>
        </div>

        <div class="stats-column completed">
          <div class="column-header">
            <i class="fas fa-check-double"></i>
            <h3>COMPLETED</h3>
          </div>
          <div class="column-body" id="completed-list"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <h3>TODOIT!</h3>
        <p>Stay neon. Stay productive.</p>
      </div>
      <div class="footer-social">
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
        <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" aria-label="Discord"><i class="fab fa-discord"></i></a>
      </div>
      <p class="footer-copy">© 2026 Todoit! — Built with neon & caffeine.</p>
    </div>
  </footer>
  </body>
</html>
